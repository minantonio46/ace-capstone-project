spring:
  datasource:
    url: jdbc:mysql://localhost:3306/medical_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Tjdqls7@}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  jackson:
    time-zone: Asia/Seoul
    date-format: yyyy-MM-dd'T'HH:mm:ss

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:skeleton-medical-service-jwt-secret-key-must-be-at-least-256-bits-long}
  access-token-expiration: 3600000      # 1시간
  refresh-token-expiration: 604800000   # 7일

ai-server:
  api-key: ${AI_API_KEY:internal-ai-server-api-key-change-this}

skeleton:
  encryption-key: ${SKELETON_ENCRYPTION_KEY:}
  key-file: ${SKELETON_ENCRYPTION_KEY_FILE:.skeleton-encryption-key}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

logging:
  level:
    com.medical: DEBUG
    org.springframework.security: INFO
